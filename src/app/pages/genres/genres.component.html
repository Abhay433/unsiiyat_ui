<div class="genres-page unsiiyat-container animate-fade-in">
  <!-- Page Header -->
  <div class="page-header text-center">
    <h1 class="page-title font-display">{{ scriptService.translate('explore_genres') }}</h1>
    <p class="page-subtitle">
      Explore classical and modern poetic forms of Urdu and Hindi literature
    </p>
  </div>

  <!-- Genres List Container (List View) -->
  <div class="genres-list-container">
    <a 
      *ngFor="let g of genres()" 
      class="genre-list-card poetic-card"
      [routerLink]="['/genre', g.id]">
      
      <!-- Left Side: Icon & Content -->
      <div class="genre-list-main">
        <div class="genre-icon-wrap">
          <span class="genre-icon">{{ getGenreIcon(g.slug) }}</span>
        </div>

        <div class="genre-info">
          <div class="genre-title-row">
            <h2 class="genre-title font-display">{{ g.name }}</h2>
            <span class="genre-badge font-mono">{{ g.slug | uppercase }}</span>
          </div>
          <p class="genre-desc">
            {{ getGenreDescription(g.slug) }}
          </p>
        </div>
      </div>

      <!-- Right Side: Action Link -->
      <div class="genre-list-action">
        <span class="explore-btn font-display">
          <span>Explore Works</span>
          <span class="action-arrow">&rarr;</span>
        </span>
      </div>
    </a>
  </div>
</div>
