<div class="app-layout" [class.rtl-layout]="scriptService.isRtl()">
  <!-- Main Header & Navigation -->
  <app-navbar (openAuth)="openAuth($event)"></app-navbar>

  <!-- Router Outlet Container -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Global Poetic Footer -->
  <app-footer></app-footer>

  <!-- Global Auth Modal -->
  <app-auth-modal
    *ngIf="showAuthModal()"
    [mode]="authMode()"
    (close)="closeAuth()">
  </app-auth-modal>
</div>
