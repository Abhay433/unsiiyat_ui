<div class="modal-backdrop" (click)="close.emit()">
  <div class="modal-card animate-fade-in" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <div class="modal-title-group">
        <span class="modal-emblem">✒️</span>
        <h3 class="modal-title font-display">
          {{ mode === 'login' ? 'Welcome to Unsiiyat' : 'Create Poet Sanctuary Account' }}
        </h3>
      </div>
      <button class="modal-close-btn" (click)="close.emit()">✕</button>
    </div>

    <!-- Mode Tabs -->
    <div class="modal-tabs">
      <button class="tab-btn" [class.active]="mode === 'login'" (click)="switchMode('login')">
        {{ scriptService.translate('login') }}
      </button>
      <button class="tab-btn" [class.active]="mode === 'register'" (click)="switchMode('register')">
        {{ scriptService.translate('register') }}
      </button>
    </div>

    <!-- Alerts -->
    <div *ngIf="errorMsg()" class="alert alert-error">
      ⚠️ {{ errorMsg() }}
    </div>
    <div *ngIf="successMsg()" class="alert alert-success">
      ✨ {{ successMsg() }}
    </div>

    <!-- Form -->
    <form (submit)="onSubmit()" class="auth-form">
      <div *ngIf="mode === 'register'" class="form-group">
        <label class="form-label">Full Name / قلمی نام</label>
        <input 
          type="text" 
          class="form-input"
          placeholder="e.g. Mirza Asadullah Khan"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          name="name"
          required />
      </div>

      <div class="form-group">
        <label class="form-label">Email Address / ای میل</label>
        <input 
          type="email" 
          class="form-input"
          placeholder="e.g. poet@unsiiyat.org"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required />
      </div>

      <div class="form-group">
        <label class="form-label">Password / پاس ورڈ</label>
        <input 
          type="password" 
          class="form-input"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required />
      </div>

      <button type="submit" class="btn btn-gold btn-block" [disabled]="loading()">
        {{ loading() ? 'Please wait...' : (mode === 'login' ? 'Login' : 'Register Account') }}
      </button>
    </form>
  </div>
</div>
